[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-trace"
version = "0.1.0"
description = "Trace and visualize what Claude Code does during a run — a workload profiler for agentic AI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fairoz Khan" }]
keywords = ["claude-code", "agentic-ai", "tracing", "profiling", "llm-workloads"]
dependencies = []  # standard library only

[project.scripts]
cc-trace = "cc_trace.cli:main"

[tool.setuptools]
packages = ["cc_trace"]
